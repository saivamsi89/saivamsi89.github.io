# Build, test and deploy the site to GitHub Pages on every push to main.
# A deployment only happens if the build and the test suite pass.
name: Test & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Hidden preview until launch; set the repository variable SITE_MODE=production to go live.
          PUBLIC_SITE_MODE: ${{ vars.SITE_MODE || 'preview' }}
          # Optional integrations, configured as repository variables when ready.
          PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
          PUBLIC_ANALYTICS: ${{ vars.ANALYTICS }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
          PUBLIC_GA4_ID: ${{ vars.GA4_ID }}

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      # Functional + accessibility tests. (Visual snapshots are machine-specific and run locally.)
      - name: Test
        run: npx playwright test tests/site.spec.ts
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
